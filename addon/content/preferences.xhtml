<linkset>
  <html:link rel="localization" href="__addonRef__-mainWindow.ftl" />
</linkset>
<vbox
  id="zbr-prefs"
  class="main-section"
  onload="Zotero.__addonInstance__?.hooks.onPrefsLoad(window)"
>
  <groupbox>
    <label><html:h2>打开方式</html:h2></label>
    <radiogroup id="zbr-open-mode" preference="__prefsPrefix__.openMode">
      <radio
        value="overlay"
        label="在 PDF 标签页里切换视图：点 PDF 工具栏上的双语图标进入，点双语页左上角的 PDF 图标返回，不多开标签页"
      />
      <radio value="tab" label="新标签页：双语页单独占一个标签页，紧挨着 PDF" />
    </radiogroup>
    <description class="zbr-hint"
      >两种方式都可以在双语页点“新窗口”移到单独的窗口，和 PDF
      左右并排。改动对之后打开的论文生效。</description
    >
  </groupbox>

  <groupbox>
    <label><html:h2>翻译</html:h2></label>
    <description class="zbr-hint"
      >阅读时按段落分批翻译，看到哪里译到哪里；每篇论文第一次翻译前，先用一次短请求定下这篇的术语表，之后各段统一使用。想让
      Agent 通读全文、统一术语后整篇译完，在双语页点“交给
      Agent…”，把任务交给你自己打开的 Agent
      会话，过程在那边看得到。</description
    >
    <html:table class="zbr-grid">
      <html:tr>
        <html:td>同时请求数</html:td>
        <html:td
          ><html:input
            type="number"
            min="1"
            max="12"
            preference="__prefsPrefix__.agentConcurrency"
          />
          分批翻译时同时发出的请求数</html:td
        >
      </html:tr>
    </html:table>
  </groupbox>

  <groupbox>
    <label><html:h2>本机 Agent</html:h2></label>
    <description class="zbr-hint"
      >翻译时用哪一个，在双语页工具栏右侧选择。“跟随工具自己的设置”表示不传参数，由该工具的配置文件决定（括号里是它当前的设置）。</description
    >
    <html:div id="zbr-agents" />
    <hbox align="center">
      <button id="zbr-detect" label="重新检测" />
      <label id="zbr-detect-result" />
    </hbox>
  </groupbox>

  <groupbox>
    <label><html:h2>翻译引擎：OpenAI 兼容 API</html:h2></label>
    <description
      >分批翻译最快的方式。每个服务商可以勾选多个模型，每个模型在阅读页的“引擎”下拉里单独出现。API
      Key 保存在 Zotero 配置文件的偏好设置中（明文）。</description
    >
    <html:div id="zbr-apis" />
    <hbox align="center">
      <button id="zbr-api-add" label="添加服务商" />
      <button
        id="zbr-api-add-cpa"
        label="添加本机 CLIProxyAPI"
        tooltiptext="http://127.0.0.1:8317/v1，默认模型 k3-256k、同时请求 16、思考强度低；Key 需要自己填"
      />
    </hbox>
  </groupbox>

  <groupbox>
    <label><html:h2>翻译与数据</html:h2></label>
    <label>术语表（每行一条：English = 中文）</label>
    <html:textarea
      rows="5"
      preference="__prefsPrefix__.glossary"
      placeholder="numerical weather prediction = 数值天气预报"
    />
    <label><html:h3>MinerU 解析</html:h3></label>
    <description class="zbr-hint"
      >只支持官方在线 API 和本地 Docker/self-hosted
      API。两个插件共用下面的共享目录；已有产物会自动复用，不会重复解析。阅读页中勾选“重新解析并覆盖”才会生成新产物并安全替换旧缓存。</description
    >
    <html:table class="zbr-grid">
      <html:tr
        ><html:td>解析方式</html:td
        ><html:td
          ><html:select preference="__prefsPrefix__.mineruMode"
            ><html:option value="official-api">MinerU 官方在线 API</html:option
            ><html:option value="self-hosted"
              >本地 Docker API</html:option
            ></html:select
          ></html:td
        ></html:tr
      >
      <html:tr
        ><html:td>共享产物目录</html:td
        ><html:td
          ><html:input
            type="text"
            preference="__prefsPrefix__.mineruSharedStoreDirectory" /></html:td
      ></html:tr>
      <html:tr
        ><html:td>官方 API 地址</html:td
        ><html:td
          ><html:input
            type="text"
            preference="__prefsPrefix__.mineruOfficialEndpoint" /></html:td
      ></html:tr>
      <html:tr
        ><html:td>官方 API Token</html:td
        ><html:td
          ><html:input
            type="password"
            preference="__prefsPrefix__.mineruOfficialToken" /></html:td
      ></html:tr>
      <html:tr
        ><html:td>本地 API 地址</html:td
        ><html:td
          ><html:input
            type="text"
            preference="__prefsPrefix__.mineruSelfHostedEndpoint"
          /><html:label
            ><html:input
              type="checkbox"
              preference="__prefsPrefix__.mineruSelfHostedAutoStart"
            />
            自动启动 Docker 服务</html:label
          ></html:td
        ></html:tr
      >
      <html:tr
        ><html:td>Docker 项目目录</html:td
        ><html:td
          ><html:input
            type="text"
            preference="__prefsPrefix__.mineruSelfHostedProjectDirectory" /></html:td
      ></html:tr>
      <html:tr
        ><html:td>Docker CLI</html:td
        ><html:td
          ><html:input
            type="text"
            preference="__prefsPrefix__.mineruDockerExecutable" /></html:td
      ></html:tr>
      <html:tr
        ><html:td>质量档</html:td
        ><html:td
          ><html:select preference="__prefsPrefix__.mineruTier"
            ><html:option value="flash">flash</html:option
            ><html:option value="basic">basic</html:option
            ><html:option value="standard">standard</html:option
            ><html:option value="advanced">advanced</html:option></html:select
          >
          <html:select preference="__prefsPrefix__.mineruMethod"
            ><html:option value="auto">自动</html:option
            ><html:option value="txt">文本</html:option
            ><html:option value="ocr">OCR</html:option></html:select
          ></html:td
        ></html:tr
      >
    </html:table>
    <description class="zbr-hint"
      >旧的按附件目录仅作兼容读取；正式产物统一写入共享目录。旧 Token
      偏好会继续读取，但建议填入上面的官方 API Token。</description
    >
    <hbox align="center">
      <button id="zbr-open-cache" label="打开译文缓存目录" />
    </hbox>
  </groupbox>
</vbox>
